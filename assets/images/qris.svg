    <rect x="110" y="290" width="35" height="15" rx="2"/>
    <rect x="160" y="285" width="80" height="80" rx="10" fill="#FAF7F2" stroke="#EE2737" stroke-width="2"/>
    <!-- Small GPN badge inside center -->
    <text x="200" y="328" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14" font-weight="900" fill="#EE2737" text-anchor="middle">GPN</text>
    <text x="200" y="344" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="8" font-weight="700" fill="#22201D" text-anchor="middle">INDONESIA</text>

    <rect x="255" y="290" width="35" height="18" rx="2"/>
    <rect x="305" y="295" width="25" height="20" rx="2"/>

    <rect x="70" y="335" width="28" height="18" rx="2"/>
    <rect x="115" y="330" width="18" height="30" rx="2"/>
    <rect x="260" y="330" width="22" height="28" rx="2"/>
    <rect x="300" y="335" width="30" height="16" rx="2"/>

    <!-- Bottom cluster -->
    <rect x="155" y="385" width="25" height="20" rx="2"/>
    <rect x="195" y="380" width="20" height="30" rx="2"/>
    <rect x="230" y="390" width="20" height="20" rx="2"/>
    <rect x="265" y="405" width="30" height="20" rx="2"/>
    <rect x="310" y="415" width="20" height="30" rx="2"/>

    <rect x="150" y="430" width="35" height="18" rx="2"/>
    <rect x="200" y="425" width="40" height="18" rx="2"/>
    <rect x="255" y="440" width="30" height="25" rx="2"/>
    <rect x="300" y="455" width="35" height="20" rx="2"/>

