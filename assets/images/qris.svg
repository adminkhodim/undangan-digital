    <rect x="210" y="460" width="20" height="25" rx="2"/>
    <rect x="245" y="475" width="35" height="15" rx="2"/>
  </g>

  <!-- Bottom Helper Note -->
  <text x="200" y="525" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="600" fill="#736C64" text-anchor="middle">Dapat di-scan dengan seluruh aplikasi M-Banking &amp; E-Wallet</text>
</svg>
