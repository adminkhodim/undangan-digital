<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 550" width="400" height="550">
  <!-- Card Background -->
  <rect width="400" height="550" rx="20" fill="#FFFFFF" stroke="#E0D7C6" stroke-width="2"/>
  
  <!-- Top Banner Red Accent -->
  <path d="M 0 20 Q 0 0 20 0 L 380 0 Q 400 0 400 20 L 400 90 L 0 90 Z" fill="#EE2737"/>
  
  <!-- QRIS White Logo Text -->
  <text x="200" y="52" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">QRIS</text>
  <text x="200" y="74" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">STANDAR PEMBAYARAN NASIONAL</text>

  <!-- Merchant Info -->
  <rect x="25" y="105" width="350" height="58" rx="10" fill="#FAF7F2" stroke="#EADCC7" stroke-width="1"/>
  <text x="200" y="128" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14" font-weight="800" fill="#22201D" text-anchor="middle">RADEN ARYA &amp; ANNISA</text>
  <text x="200" y="148" font-family="monospace" font-size="11" font-weight="600" fill="#8C857B" text-anchor="middle">NMID : ID1020261220999</text>

  <!-- QR Code Frame -->
  <rect x="40" y="180" width="320" height="320" rx="12" fill="#FFFFFF" stroke="#D4AF37" stroke-width="2"/>
  
  <!-- QR Code Matrix Simulation -->
  <!-- Top-Left Finder Pattern -->
  <rect x="65" y="205" width="70" height="70" rx="8" fill="#1E1B18"/>
  <rect x="77" y="217" width="46" height="46" rx="4" fill="#FFFFFF"/>
  <rect x="87" y="227" width="26" height="26" rx="2" fill="#1E1B18"/>

  <!-- Top-Right Finder Pattern -->
  <rect x="265" y="205" width="70" height="70" rx="8" fill="#1E1B18"/>
  <rect x="277" y="217" width="46" height="46" rx="4" fill="#FFFFFF"/>
  <rect x="287" y="227" width="26" height="26" rx="2" fill="#1E1B18"/>

  <!-- Bottom-Left Finder Pattern -->
  <rect x="65" y="405" width="70" height="70" rx="8" fill="#1E1B18"/>
  <rect x="77" y="417" width="46" height="46" rx="4" fill="#FFFFFF"/>
  <rect x="87" y="427" width="26" height="26" rx="2" fill="#1E1B18"/>

  <!-- QR Matrix Grid Cells (Simulated Authentic High-Density Data) -->
  <g fill="#1E1B18">
    <!-- Center Logo Badge -->
    <rect x="155" y="210" width="16" height="16" rx="2"/>
    <rect x="185" y="210" width="16" height="30" rx="2"/>
    <rect x="215" y="210" width="30" height="16" rx="2"/>

    <rect x="150" y="245" width="24" height="20" rx="2"/>
    <rect x="190" y="250" width="20" height="20" rx="2"/>
    <rect x="225" y="240" width="18" height="24" rx="2"/>

    <!-- Middle cluster -->
